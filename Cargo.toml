[package]
name = "tree-sitter-powershell"
description = "A Powershell grammar for tree-sitter (CaptainEmpower fork of 0.26.6 with the patches in PATCHES.md)"
# Upstream 0.26.6 plus the patches listed in PATCHES.md. The build metadata
# (`+semcode.N`) says so without claiming an upstream release number; bump N
# with every patch. Cargo ignores build metadata when matching requirements.
version = "0.26.6+semcode.1"
authors = ["Airbus CERT <cert@airbus.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "powershell"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/CaptainEmpower/tree-sitter-powershell"
edition = "2021"
autoexamples = false
# Consumed as a git dependency pinned by commit, never through crates.io:
# the crate name belongs to upstream there, and the tag-triggered publish
# workflows inherited from upstream must not push this fork under it.
publish = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
  "/PATCHES.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.5"
